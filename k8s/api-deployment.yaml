apiVersion: apps/v1
kind: Deployment
metadata:
  name: rps-api
spec:
  replicas: 1

  selector:
    matchLabels:
      app: rps-api

  template:
    metadata:
      labels:
        app: rps-api

    spec:
      containers:
        - name: rps-api
          image: rdanish/rps-api-go:latest

          ports:
            - containerPort: 8080

          env:
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: rps-api-config
                  key: DB_USER
            
            - name: DB_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: rps-api-config
                  key: DB_PASSWORD
            
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: rps-api-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: rps-api-config
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: rps-api-config
                  key: DB_NAME